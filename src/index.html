<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH Desktop</title>
    <link rel="icon" href="./icon.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .card {
        text-align: center;
        padding: 24px;
      }
      .logo {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        margin-bottom: 24px;
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
        user-select: none;
        -webkit-user-drag: none;
      }
      .spinner {
        width: 42px;
        height: 42px;
        border: 4px solid #334155;
        border-top-color: #3b82f6;
        border-radius: 50%;
        margin: 0 auto 20px;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      #status {
        color: #94a3b8;
        font-size: 14px;
        margin-top: 8px;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="./icon.png" alt="DSH" />
      <div class="spinner"></div>
      <h1>正在启动 DSH 服务…</h1>
      <div id="status"></div>
    </div>
  </body>
</html>
